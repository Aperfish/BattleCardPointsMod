name: Release

# 推送 v* 标签或在 main 更新版本/发布工作流时构建发布。
# 包内布局为 Mods 目录式: zip 根目录下是 BattleCardPointsMod\ 文件夹,
# 解压到 AstralParty_ModLoader\mods\ 即得到 mods\BattleCardPointsMod\。
on:
  push:
    branches:
      - main
    paths:
      - BattleCardPointsMod.json
      - .github/workflows/release.yml
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # 编译所需的 CesiumLoader.SDK 与游戏程序集从该 tag 取得
  CESIUM_LOADER_REF: modloader-2.9.1

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Prepare reference assemblies
        shell: pwsh
        run: pwsh -NoProfile -File tools/fetch-refs.ps1 -CesiumLoaderRef $env:CESIUM_LOADER_REF

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          } elseif ("${{ github.event_name }}" -eq "push") {
            $version = (Get-Content BattleCardPointsMod.json -Raw | ConvertFrom-Json).version
          } else {
            $version = "manual-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "version=$version"

      - name: Verify sidecar version
        shell: pwsh
        run: |
          # 标签版本与 sidecar 不一致时, 运行时 ExportSidecar 会把 json 改回源码里的版本
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { Write-Host "手动构建, 跳过标签校验"; exit 0 }
          $sidecar = Get-Content BattleCardPointsMod.json -Raw | ConvertFrom-Json
          if ($sidecar.version -ne "${{ steps.version.outputs.version }}") {
            throw "标签版本 ${{ steps.version.outputs.version }} 与 BattleCardPointsMod.json 的 version $($sidecar.version) 不一致"
          }

      - name: Build
        shell: pwsh
        run: |
          dotnet build source/BattleCardPointsMod.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/BattleCardPointsMod.Tests/BattleCardPointsMod.Tests.csproj --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage package
        shell: pwsh
        run: |
          $out = "source/bin/Release/netstandard2.0"
          $stage = "staging/BattleCardPointsMod"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          foreach ($file in @("BattleCardPointsMod.dll", "BattleCardPointsMod.pdb")) {
            $path = Join-Path $out $file
            if (-not (Test-Path $path)) { throw "缺少构建产物: $path" }
            Copy-Item $path $stage -Force
          }
          Copy-Item "BattleCardPointsMod.json" $stage -Force
          Copy-Item config.json, LICENSE, NOTICE.md $stage -Force

          $zip = "BattleCardPointsMod-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path staging/BattleCardPointsMod -DestinationPath $zip -CompressionLevel Optimal
          Copy-Item $zip "BattleCardPointsMod.zip" -Force
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: battle-card-points-package
          path: BattleCardPointsMod*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: battle-card-points-package
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 战斗牌点数显示 ${{ needs.build.outputs.version }}
          files: artifacts/*.zip
          fail_on_unmatched_files: true
          body: |
            ## 更新日志

            - 移除了手牌上的范围点数，为概率预留位置。

            ## 安装

            1. 下载本页附件里的 `BattleCardPointsMod-<版本>.zip`（或固定地址 `BattleCardPointsMod.zip`）。
            2. 解压到游戏 exe 目录下的 `AstralParty_ModLoader\mods\`，得到 `mods\BattleCardPointsMod\BattleCardPointsMod.dll` 与 `BattleCardPointsMod.json`。
            3. 重启游戏。已有旧版本时，覆盖更新即可。

            需要 CesiumLoader（SDK 不低于 2.9.1）。卸载时删除 `mods\BattleCardPointsMod\` 目录。

            ## 说明

            - 战斗界面显示双方实时攻防与已同步的判定骰点数。
            - 已出牌上方显示服务器同步的实际点数。
            - 配置位于 `mods\BattleCardPointsMod\config.json`，也可在 AstralParty.Toys 的模组配置页修改。
            - 完整说明与配置项见仓库 [README](${{ github.server_url }}/${{ github.repository }}#readme)。
